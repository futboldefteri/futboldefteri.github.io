<body><h1>Canlı skor tanısı</h1><p>Bu kutudaki metnin tamamını kopyalayıp gönder.</p><pre id="o">çalışıyor…</pre>

var o=document.getElementById("o"),L=[];function y(s){L.push(s);o.textContent=L.join("\n")}
y("tarayici: "+navigator.userAgent);y("pencere genisligi: "+innerWidth+" px · dar ekran kurali: "+matchMedia("(max-width:860px)").matches);
y("saat (UTC): "+new Date().toISOString());
var g=new Date(Date.now()+3*36e5).toISOString().slice(0,10).replace(/-/g,"");
fetch("canli.json",{cache:"no-store"}).then(function(r){y("canli.json: HTTP "+r.status);return r.json()}).then(function(j){
 y("canli.json ligler: "+Object.keys(j.lig).join(","));

}).then(function(r){y("ESPN: HTTP "+r.status);return r.json()}).then(function(d){
 var n=0;(d.events||[]).forEach(function(e){var st=e.status.type;var c=e.competitions[0].competitors;
  y("  "+st.state+" "+st.shortDetail+" · "+c.map(function(x){return x.team.displayName+" "+x.score}).join(" - "));n++});
 y("ESPN olay sayisi: "+n);y("SONUC: ESPN erisilebilir");
